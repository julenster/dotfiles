# Caché de shaders de Mesa (gráficas AMD e Intel), más grande que el 1 GB por defecto: si se
# llena, Mesa borra shaders compilados y los juegos grandes los vuelven a compilar en plena
# partida (tirones). Va en el DISCO (no gasta RAM ni VRAM).
# Es una plantilla: bootstrap.sh cambia @SIZE@ por un tamaño según tu disco (el mismo que la de
# NVIDIA) y la guarda en ~/.config/environment.d/. Se aplica al volver a iniciar sesión.
MESA_SHADER_CACHE_MAX_SIZE=@SIZE@
