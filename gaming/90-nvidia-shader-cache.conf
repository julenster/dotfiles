# Caché de shaders de NVIDIA grande y sin limpieza automática (por defecto es 1 GB y se borran
# los antiguos, así que los juegos grandes recompilaban shaders en plena partida y daban
# tirones). Recomendación de la wiki de CachyOS para proton-cachyos. Va en el DISCO (no gasta
# RAM ni VRAM).
# Es una plantilla: bootstrap.sh cambia @SIZE@ por un tamaño según tu disco (10 % del disco,
# entre 2 y 12 GB, y nunca más del 20 % del espacio libre) y la guarda en
# ~/.config/environment.d/, así la ven todos los programas de la sesión, también Steam abierto
# desde el menú. Hace falta cerrar sesión para que se aplique.
__GL_SHADER_DISK_CACHE_SIZE=@SIZE@
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
