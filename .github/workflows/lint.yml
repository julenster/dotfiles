name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -s bash bootstrap.sh kde/apply.sh gnome/apply.sh gnome/appearance.sh scripts/*
      - name: JSON válido
        run: |
          sed 's#^\s*//.*##' fastfetch/fallback.jsonc | python3 -m json.tool >/dev/null
          python3 -m json.tool vscode/settings.json >/dev/null
