# kitty — configuración de kovasko/hyprland-dotfiles (+ transparencia y desenfoque)
font_family JetBrainsMono Nerd Font 
font_size 10.0
adjust_line_height  100%
cursor_shape block
cursor_blink_interval 1000000000
cursor_stop_blinking_after 0.0
window_padding_width 6.0
foreground #cdd6f4
background #1e1e2e
selection_foreground #1e1e2e
selection_background #585b70
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8
background_opacity 0.75
background_blur 1
confirm_os_window_close 0
enable_audio_bell no
initial_window_width 750
initial_window_height 900
remember_window_size no

cursor_shape beam
cursor_beam_thickness 1.0
cursor_text_color #000000
cursor_blink_interval 500

cursor_trail 1
cursor_trail_start_threshold 0
cursor_trail_decay 0.1 0.4

window_padding_width 0
window_margin_width 2
hide_window_decorations no