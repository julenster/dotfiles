# Pantalla de inicio de sesión: SDDM. El tema (Breeze) lo elige sddm/install-theme.sh
# en /etc/sddm.conf.d/zz-theme.conf. Este se llama zzz- para leerse después de los demás y que
# su GreeterEnvironment sea el que cuenta. bootstrap.sh lo copia a /etc/sddm.conf.d/.
[General]
# Sin X11 instalado: SDDM se dibuja con KWin en Wayland, igual que el escritorio
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Theme]
CursorTheme=Bibata-Modern-Classic
CursorSize=24
